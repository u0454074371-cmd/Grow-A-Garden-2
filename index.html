<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grow Garden 2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading">
  <div class="loader-card">
    <div class="loader-logo">🌱</div>
    <h1>Grow Garden 2</h1>
    <p id="loading-text">Wereld bouwen...</p>
    <div class="loader-track"><div id="loading-progress"></div></div>
  </div>
</div>

<canvas id="world"></canvas>

<div id="hud" hidden>
  <div class="top">
    <div class="brand"><span>🌱</span><div><b>Grow Garden 2</b><small id="status">LOCAL SAVE</small></div></div>
    <div class="wallet">
      <div>🪙 <b id="coins">250</b></div>
      <div>💎 <b id="gems">10</b></div>
      <div>⭐ <b id="level">1</b></div>
    </div>
    <button id="help">?</button>
  </div>
  <div id="quest"><small>QUEST</small><b>First Harvest</b><span id="questText">0 / 10</span><i><u id="questBar"></u></i></div>
  <div id="crosshair">+</div>
  <div id="interaction" hidden><b id="interactionTitle">Plant</b><span>Druk E</span></div>
  <div id="bottom">
    <div id="seeds"></div>
    <button class="big" id="shop">SHOP</button>
    <button class="big" id="pets">PETS</button>
  </div>
  <div id="toast"></div>
  <div id="mobile" hidden>
    <div id="joy"><div id="joyStick"></div></div>
    <button id="jump">↑</button>
    <button id="interact">E</button>
  </div>
  <div id="helpPanel" hidden></div>
</div>

<script src="./scripts/main.js"></script>
</body>
</html>
